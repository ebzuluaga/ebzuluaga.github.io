<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>

    <!-- 1. Try JavaScript first (Fastest, preserves history via replace) -->
    <script>
        window.location.replace("/");
    </script>

    <!-- 2. Fallback strictly for users/bots without JavaScript -->
    <noscript>
        <meta http-equiv="refresh" content="0;url=/" />
    </noscript>
</head>
<body>
    <p>If you are not redirected, <a href="/">click here</a>.</p>
</body>
</html>
